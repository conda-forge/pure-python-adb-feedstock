schema_version: 1

context:
  name: pure-python-adb
  version: 0.3.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pure-python-adb-${{ version }}.tar.gz
  sha256: 0ecc89d780160cfe03260ba26df2c471a05263b2cad0318363573ee8043fb94d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ppadb
        - ppadb.command
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: This is pure-python implementation of the ADB client.
  description: |
    This is pure-python implementation of the ADB client. You can use it
    to communicate with adb server (not the adb daemon on the device/
    emulator).
  homepage: https://github.com/Swind/pure-python-adb
  repository: https://github.com/Swind/pure-python-adb
  documentation: https://github.com/Swind/pure-python-adb

extra:
  recipe-maintainers:
    - jan-janssen
